<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正在跳转到 dnshe.com ...</title>

  <!-- 方式一：meta 刷新（0 秒立即跳转，不依赖 JS） -->
  <meta http-equiv="refresh" content="0; url=https://dnshe.com/">

  <!-- 告诉搜索引擎这是跳转页，不要收录 -->
  <meta name="robots" content="noindex, nofollow">

  <!-- 方式二：canonical 声明目标地址 -->
  <link rel="canonical" href="https://dnshe.com/">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .box { text-align: center; padding: 24px; }
    .spinner {
      width: 48px;
      height: 48px;
      margin: 0 auto 20px;
      border: 4px solid rgba(226, 232, 240, .25);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
    p  { font-size: 14px; color: #94a3b8; margin: 0 0 18px; }

    a.btn {
      display: inline-block;
      padding: 10px 22px;
      font-size: 14px;
      color: #0f172a;
      background: #38bdf8;
      border-radius: 8px;
      text-decoration: none;
      transition: opacity .2s;
    }
    a.btn:hover { opacity: .85; }
  </style>
</head>
<body>

  <div class="box">
    <div class="spinner"></div>
    <h1>正在跳转到 dnshe.com</h1>
    <p id="tip">如果没有自动跳转，请点击下面的按钮</p>
    <a class="btn" href="https://dnshe.com/" rel="noopener">前往 dnshe.com</a>
  </div>

  <script>
    // 方式三：JS 跳转（用 replace 避免用户按返回键又回到本页）
    (function () {
      var target = "https://dnshe.com/";
      // 立即跳转
      window.location.replace(target);
      // 兜底：某些浏览器/内嵌 WebView 里 replace 被拦截时再试一次
      setTimeout(function () {
        if (window.location.href.indexOf("dnshe.com") === -1) {
          window.location.href = target;
        }
      }, 500);
    })();

    // 倒计时提示（可选，视觉反馈）
    (function () {
      var n = 3;
      var tip = document.getElementById("tip");
      var t = setInterval(function () {
        if (n <= 0) { clearInterval(t); return; }
        tip.textContent = n + " 秒后跳转…";
        n--;
      }, 1000);
    })();
  </script>

</body>
</html>
